{{- with $.Values.synapse -}}
{{- $extraAnnotations := dict -}}
{{- if eq (include "element-io.ess-library.ingress-controller-type" (dict "root" $ "context" .ingress.controllerType)) "ingress-nginx" -}}
{{- $_ := set $extraAnnotations "nginx.ingress.kubernetes.io/proxy-body-size" .media.maxUploadSize -}}
{{- end -}}
{{- include "element-io.ess-library.inboundTrafficHandler.ingress" (dict "root" $ "context" (dict
  "component" .
  "componentName" "synapse"
  "ingressName" "synapse"
  "extraAnnotations" $extraAnnotations
  "labels" (include "element-io.synapse-ingress.labels" (dict "root" $ "context" $.Values.haproxy))
)) }}
{{- end -}}
