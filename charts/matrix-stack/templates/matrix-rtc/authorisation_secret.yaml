{{- with $.Values.matrixRTC -}}
{{- if .enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-matrix-rtc-authorisation
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "element-io.matrix-rtc-authorisation.labels" (dict "root" $ "context" .) | nindent 4 }}
type: Opaque
data:
  {{- include "element-io.matrix-rtc-authorisation.secret-data" (dict "root" $ "context" .) | nindent 2 -}}
{{- end -}}
{{- end -}}
