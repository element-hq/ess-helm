{{- if (include "element-io.valkey.internalValkeyEnabled" (dict "root" $)) -}}
{{- with (mustMergeOverwrite ($.Values.valkey | deepCopy) ($.Values.redis | deepCopy)) -}}
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "element-io.valkey.labels" (dict "root" $ "context" .) | nindent 4 }}
  name: {{ $.Release.Name }}-valkey
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  ipFamilyPolicy: PreferDualStack
  ports:
  - port: 6379
    targetPort: valkey
    name: valkey
  - port: 9121
    targetPort: metrics
    name: metrics
  selector:
    app.kubernetes.io/instance: "{{ $.Release.Name }}-valkey"
{{- end }}
{{- end }}
