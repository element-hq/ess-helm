# source_fragments: element-admin-minimal.yaml element-admin-pytest-extras.yaml element-web-minimal.yaml element-web-pytest-extras.yaml init-secrets-minimal.yaml init-secrets-pytest-extras.yaml matrix-authentication-service-minimal.yaml matrix-authentication-service-pytest-extras.yaml postgres-minimal.yaml server-name.yaml synapse-minimal.yaml synapse-pytest-base-extras.yaml well-known-minimal.yaml well-known-pytest-base-extras.yaml
# DO NOT EDIT DIRECTLY. Edit the fragment files to add / modify / remove values

deploymentMarkers:
  enabled: false
elementAdmin:
  annotations:
    has-no-service-monitor: "true"
  ingress:
    host: admin.{{ $.Values.serverName }}
    tlsSecret: "{{ $.Release.Name }}-element-admin-tls"
  podSecurityContext:
    runAsGroup: 0
  replicas: 2
elementWeb:
  additional:
    user-config.json: |
      {
        "default_server_config": {
          "m.homeserver": {
            "base_url": "https://synapse.{{ $.Values.serverName }}"
          }
        },
        "some_key": {
          "some_value": "https://test.{{ $.Values.serverName }}"
        }
      }
  annotations:
    has-no-service-monitor: "true"
  ingress:
    host: element.{{ $.Values.serverName }}
    tlsSecret: "{{ $.Release.Name }}-element-web-tls"
  podSecurityContext:
    runAsGroup: 0
  replicas: 2
haproxy:
  podSecurityContext:
    runAsGroup: 0
  replicas: 2
initSecrets:
  annotations:
    has-no-service-monitor: "true"
  podSecurityContext:
    runAsGroup: 0
matrixAuthenticationService:
  additional:
    000-pytest-admin:
      configSecret: "{{ $.Release.Name }}-pytest-admin"
      configSecretKey: "admin.yaml"
  extraEnv:
    - name: DEBUG_RENDERING
      value: "1"
  ingress:
    host: mas.{{ $.Values.serverName }}
    tlsSecret: "{{ $.Release.Name }}-mas-web-tls"
  podSecurityContext:
    runAsGroup: 0
  replicas: 2
  syn2mas:
    extraEnv:
      - name: DEBUG_RENDERING
        value: "1"
matrixRTC:
  enabled: false
postgres:
  podSecurityContext:
    runAsGroup: 0
serverName: ess.localhost
synapse:
  checkConfigHook:
    annotations:
      has-no-service-monitor: "true"
  extraArgs:
    # Validate that any Synapse config that has a <foo>_path equivalent uses it
    - --no-secrets-in-config
  extraEnv:
    - name: DEBUG_RENDERING
      value: "1"
  ingress:
    host: synapse.{{ $.Values.serverName }}
    tlsSecret: "{{ $.Release.Name }}-synapse-web-tls"
  podSecurityContext:
    runAsGroup: 0
wellKnownDelegation:
  ingress:
    tlsSecret: "{{ $.Release.Name }}-well-known-web-tls"
