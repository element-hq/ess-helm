# DO NOT EDIT DIRECTLY. Edit the fragment files to add / modify / remove values

# postgres don't have any required properties to be set and defaults to enabled
deploymentMarkers:
  enabled: false
elementAdmin:
  enabled: false
elementWeb:
  enabled: false
initSecrets:
  enabled: false
matrixAuthenticationService:
  enabled: false
matrixRTC:
  appserviceRegistration:
    secret: "{{ $.Release.Name }}-matrix-rtc-external-registration"
    secretKey: registration.yaml
  ingress:
    host: mrtc.ess.localhost
  livekitAuth:
    key: CHANGEME-oolahd9xooshohSh5IeQu1natheur1oo
    secret:
      secret: "{{ $.Release.Name }}-matrix-rtc-external"
      secretKey: livekitSecret
serverName: ess.localhost
synapse:
  appservices:
    - secret: "{{ $.Release.Name }}-synapse-external"
      secretKey: bridge_registration.yaml
  ingress:
    host: synapse.ess.localhost
  macaroon:
    secret: "{{ $.Release.Name }}-synapse-external"
    secretKey: macaroon
  postgres:
    database: synapse
    host: ess-postgres
    password:
      secret: "{{ $.Release.Name }}-synapse-external"
      secretKey: postgresPassword
    user: synapse_user
  registrationSharedSecret:
    secret: "{{ $.Release.Name }}-synapse-external"
    secretKey: registrationSharedSecret
  signingKey:
    secret: "{{ $.Release.Name }}-synapse-external"
    secretKey: signingKey
wellKnownDelegation:
  enabled: false
