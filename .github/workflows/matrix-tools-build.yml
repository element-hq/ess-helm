name: Build the matrix-tools container image

on:
  workflow_call:
    inputs:
      push:
        description: Push the built image to the registry
        required: true
        type: boolean
    outputs:
      image:
        description: The reference of the pushed image, with its sha tag. Empty when the
          image was not pushed.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/matrix-tools

jobs:
  build:
    name: Build matrix-tools container image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Login to GHCR
      if: ${{ inputs.push }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Release Tag
      if: github.ref_type == 'tag' # Only for GitHub releases
      run: |
        echo "Converting $GITHUB_REF to tags"
        echo "VERSION=${GITHUB_REF#refs\/tags\/matrix-tools-}" >> "$GITHUB_ENV"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: |
          ${{ env.REGISTRY_IMAGE }}
        flavor: |
          latest=false
        tags: |
          type=raw,value=${{ env.VERSION }},enable=${{ github.ref_type == 'tag' }}
          type=sha,prefix=sha-,format=short
        labels: |
          org.opencontainers.image.licenses=AGPL-3.0-only
        annotations: |
          org.opencontainers.image.licenses=AGPL-3.0-only

    - name: Compute the image reference
      # The callers reference the image through its sha tag: it says exactly which code
      # the image was built from. The pytest workflow passes it to the integration tests,
      # which deploy it in their k3d cluster. Only a pushed image can be referenced: the
      # tests could not download it otherwise.
      if: ${{ inputs.push }}
      id: image
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        # The tags output lists full references, e.g. "ghcr.io/<org>/<repo>/matrix-tools:sha-0123abcd"
        sha_tag="$(grep -oE 'sha-[a-f0-9]+' <<< "$TAGS" | head -n 1)"
        if [ -z "$sha_tag" ]; then
          echo "No sha tag in the metadata tags:" >&2
          echo "$TAGS" >&2
          exit 1
        fi
        echo "image=${REGISTRY_IMAGE}:${sha_tag}" | tee -a "$GITHUB_OUTPUT"

    - name: Build and Push Image
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7.5.0
      with:
        push: ${{ inputs.push }}
        files: |
          docker-bake.hcl
          cwd://${{ steps.meta.outputs.bake-file }}
        targets: matrix-tools
        set: |
          *.platform=linux/amd64,linux/arm64
        # https://docs.zizmor.sh/audits/#cache-poisoning
        # This is not catched by zizmor but arguably we need to disable cache for docker builds
        # See related issue https://github.com/zizmorcore/zizmor/issues/774
        no-cache: ${{ github.ref_type == 'tag' }}

    - name: Compute the image digest
      # The digest pins the exact image this job pushed. The pytest workflow
      # passes it to the integration tests, so they test exactly this image.
      if: ${{ inputs.push }}
      id: digest
      env:
        IMAGE: ${{ steps.image.outputs.image }}
      run: |
        digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{ .Manifest.Digest }}')"
        if [ -z "$digest" ]; then
          echo "Could not read the digest of $IMAGE" >&2
          exit 1
        fi
        echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
