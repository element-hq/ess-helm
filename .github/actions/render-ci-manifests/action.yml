name: Render CI manifests
description: Render the manifests of all the CI values files of the chart, one directory per values file

inputs:
  output-dir:
    description: Directory to render the manifests into
    required: true
  source-dir:
    description: Directory containing the chart to render
    default: '.'

runs:
  using: composite
  steps:
  - name: Render the manifests of the CI values files
    shell: bash
    env:
      SOURCE_DIR: ${{ inputs.source-dir }}
      OUTPUT_DIR: ${{ inputs.output-dir }}
    run: |
      set -euo pipefail

      render_values_file() {
        values=$1
        values_file=$(basename "$values" ".yaml")
        echo "Rendering the manifests of $values_file"
        mkdir -p "$OUTPUT_DIR/$values_file"
        (cd "$SOURCE_DIR" && helm template \
            -n ess-ci \
            -a monitoring.coreos.com/v1/ServiceMonitor \
            -a cert-manager.io/v1/Certificate \
            -f "$values" charts/matrix-stack) | \
        yq ea '[.] | .[] | splitDoc' | \
        yq -s "\"$OUTPUT_DIR/$values_file/\""' + ([.kind, .metadata.name] | join("-") | downcase) + ".yaml"'
      }
      export -f render_values_file
      export SOURCE_DIR OUTPUT_DIR

      # Rendering the manifests is the slow part of a dyff. We render the
      # values files in parallel to use all the CPU cores of the runner.
      printf '%s\n' "$SOURCE_DIR"/charts/matrix-stack/ci*/*values.yaml | \
        xargs -P "$(nproc)" -n1 bash -c 'set -euo pipefail; render_values_file "$1"' _
